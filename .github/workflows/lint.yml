name: lint
# Zero lint errors required at every commit (engineering standard #5).
on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verilator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq verilator
      - name: Lint (verilator --lint-only -Wall)
        run: make lint
      # verible is a Google release binary (not in apt); wired into `make lint` and added to CI
      # in Phase 1+ when its style rules are tuned. Until then verilator is the hard gate.
