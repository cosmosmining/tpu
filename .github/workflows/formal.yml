name: formal
# SymbiYosys proofs (FIFO / control-FSM / descriptor-queue / accumulator write-conflict).
# Phase 0: `make formal` is a documented placeholder (exits 0). In Phase 4 this job installs
# yosys + sby (oss-cad-suite) and runs real proofs; the install step is added then.
on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yosys
        run: sudo apt-get update -qq && sudo apt-get install -y -qq yosys
      - name: Formal proofs (FIFO safety + core FSM/accumulator)
        run: make formal
