name: gds
# Tiny Tapeout signoff GDS via the official TT action (TTSKY26c shuttle, sky130A).
#
# Dispatch + version-tag only (NOT every push): the OpenLane hardening run is ~30 min, so we run
# it at the frozen tapeout point (manual dispatch) and on v* release tags — not on every dev
# commit. This produces the GDS plus the OpenLane area / utilization / STA timing reports that
# grade PREDICTIONS.md. precheck / gl_test / viewer are added once a LICENSE and the gate-level
# test/ harness are in place. See DECISIONS.md (2026-06-07).
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: TinyTapeout/tt-gds-action@ttsky26c
        with:
          pdk: sky130A
